name: Build Living World
on:
  push:
    branches: [living-world-forge-1.16.5]
    paths:
      - 'Minecraft/LivingWorld/**'
      - '.github/workflows/build-livingworld.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Minecraft/LivingWorld
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LivingWorld-Forge-1.16.5
          path: Minecraft/LivingWorld/build/libs/*.jar
          if-no-files-found: error
