name: Build ZH Cryptor
on:
  push:
    branches: [usb-encryptor-rebuild]
    paths:
      - 'ZH-Cryptor/**'
      - '.github/workflows/build-zh-cryptor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ZH-Cryptor/**'
      - '.github/workflows/build-zh-cryptor.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ZH-Cryptor -B build -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run crypto self-test
        run: build/Release/ZHCryptor.exe --self-test
      - name: Prepare portable EXE and ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ZHCryptor.exe dist/ZHCryptor-${{ matrix.arch }}.exe
          Compress-Archive -Path dist/ZHCryptor-${{ matrix.arch }}.exe, ZH-Cryptor/README.md -DestinationPath dist/ZHCryptor-${{ matrix.arch }}-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ZH-Cryptor-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
