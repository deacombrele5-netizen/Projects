name: Build ZH Builder

on:
  push:
    branches:
      - zhbuilder-forge-1.16.5
    paths:
      - 'Minecraft/ZHBuilder/**'
      - '.github/workflows/build-zhbuilder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Minecraft/ZHBuilder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Clear stale ForgeGradle caches
        run: rm -rf ~/.gradle/caches/forge_gradle
      - name: Build Forge mod
        run: gradle build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ZHBuilder-Forge-1.16.5
          path: Minecraft/ZHBuilder/build/libs/*.jar
          if-no-files-found: error
