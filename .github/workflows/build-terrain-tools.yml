name: Build Terrain Tools

on:
  push:
    paths:
      - 'Minecraft/TechgunsTerrainTools/**'
      - '.github/workflows/build-terrain-tools.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Minecraft/TechgunsTerrainTools
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Build
        run: gradle build --no-daemon

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Minecraft/TechgunsTerrainTools/build/libs/*.jar
          generate_release_notes: false
