name: Build Terrain Tools

on:
  push:
    branches:
      - main
    paths:
      - 'Minecraft/TechgunsTerrainTools/**'
      - '.github/workflows/build-terrain-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Minecraft/TechgunsTerrainTools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Build
        run: gradle build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Terrain Tools 1.0.0
          target_commitish: main
          files: Minecraft/TechgunsTerrainTools/build/libs/*.jar
          generate_release_notes: false
          body: ""
